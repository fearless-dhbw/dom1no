<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="439px" preserveAspectRatio="none" style="width:601px;height:439px;background:#FFFFFF;" version="1.1" viewBox="0 0 601 439" width="601px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="226.7151" x="183.6424" y="24.9659">DOM1NO &#8212; semester user goals</text></g><!--cluster DOM1NO--><g class="cluster" data-qualified-name="DOM1NO" data-source-line="7" id="ent0002"><rect fill="none" height="316" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="193" x="353" y="115.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="65.2397" x="416.8801" y="132.5339">DOM1NO</text></g><!--entity Player--><g class="entity" data-qualified-name="Player" data-source-line="6" id="ent0001"><ellipse cx="141.8769" cy="251.5679" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M141.8769,259.5679 L141.8769,286.5679 M128.8769,267.5679 L154.8769,267.5679 M141.8769,286.5679 L128.8769,301.5679 M141.8769,286.5679 L154.8769,301.5679" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.7538" x="121.5" y="318.0339">Player</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="20" id="ent0014"><path d="M314,44.0679 L314,107.186 A0,0 0 0 0 314,107.186 L445.5,107.186 L449.5,145.9156 L453.5,107.186 L585.1073,107.186 A0,0 0 0 0 585.1073,107.186 L585.1073,54.0679 L575.1073,44.0679 L314,44.0679 A0,0 0 0 0 314,44.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M575.1073,44.0679 L575.1073,54.0679 L585.1073,54.0679 L575.1073,44.0679" fill="#FEFFDD" style="s