Adjust="spacing" textLength="83.5797" x="407.8099" y="168.5849">Play a match</text></g><!--entity Join--><g class="entity" data-qualified-name="DOM1NO.Join" data-source-line="9" id="ent0004"><ellipse cx="449.3278" cy="216.5335" fill="#F1F1F1" rx="85.3278" ry="19.4656" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.2455" x="382.2051" y="222.5674">Join an online match</text></g><!--entity Invite--><g class="entity" data-qualified-name="DOM1NO.Invite" data-source-line="10" id="ent0005"><ellipse cx="449.7255" cy="282.7349" fill="#F1F1F1" rx="81.7255" ry="28.667" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.9696" x="391.2407" y="281.1212">Invite players to a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.9297" x="404.2606" y="300.1891">private match</text></g><!--entity Request--><g class="entity" data-qualified-name="DOM1NO.Request" data-source-line="11" id="ent0006"><ellipse cx="449.3448" cy="349.6369" fill="#F1F1F1" rx="88.3448" ry="20.069" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.5815" x="378.5541" y="355.6708">Send a friend request</text></g><!--entity Chat--><g class="entity" data-qualified-name="DOM1NO.Chat" data-source-line="12" id="ent0007"><ellipse cx="449.4132" cy="405.6506" fill="#F1F1F1" rx="78.4132" ry="18.0826" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.8715" x="390.9774" y="411.6845">Chat with a friend</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" id="lnk8"><path d="M162.5189,268.9325 C193.2681,248.1148 255.5222,208.6121 314,187.5679 C337.3533,179.1639 364.0